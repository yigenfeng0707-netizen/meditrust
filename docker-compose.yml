# ============================================================
# 医数可信 Docker Compose
# ============================================================
# 使用方式：
#   开发模式：docker compose --profile dev up
#   生产模式：docker compose --profile prod up -d
#
# 网络隔离（P2 运维加固）：
#   - meditrust-edge：对外暴露的服务（前端）
#   - meditrust-internal：后端 + 数据层，postgres/redis/chromadb
#     不映射宿主机端口，仅容器间可达（等保三级"边界防护"）
# ============================================================

services:
  # ============================================================
  # 后端 API
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yibao-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-yibao}:${POSTGRES_PASSWORD:-yibao123}@postgres:5432/${POSTGRES_DB:-yibao}
      - REDIS_URL=redis://redis:6379
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://aiping.cn/api/v1}
      - LLM_MODEL=${LLM_MODEL:-Kimi-K3}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - DASHSCOPE_MODEL=${DASHSCOPE_MODEL:-qwen-plus}
      - OCR_API_KEY=${OCR_API_KEY:-}
      - OCR_API_URL=${OCR_API_URL:-https://api.ocr.space/parse/image}
      - YIBAO_API_KEY=${YIBAO_API_KEY:-}
      - YIBAO_SESSION_SECRET=${YIBAO_SESSION_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - DEMO_OFFLINE=${DEMO_OFFLINE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend:/app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [meditrust-edge, meditrust-internal]
    profiles: ["dev"]

  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yibao-backend-prod
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-yibao}:${POSTGRES_PASSWORD:?生产模式必须设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yibao}
      - REDIS_URL=redis://redis:6379
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://aiping.cn/api/v1}
      - LLM_MODEL=${LLM_MODEL:-Kimi-K3}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - DASHSCOPE_MODEL=${DASHSCOPE_MODEL:-qwen-plus}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_BASE_URL=${VISION_BASE_URL:-https://aiping.cn/api/v1}
      - VISION_MODEL=${VISION_MODEL:-GLM-4.6V}
      - OCR_API_KEY=${OCR_API_KEY:-}
      - YIBAO_API_KEY=${YIBAO_API_KEY}
      - YIBAO_SESSION_SECRET=${YIBAO_SESSION_SECRET}
      # 生产模式（fail-closed，默认）：以下三项缺失时 compose 直接报错，且后端启动校验也会拒绝
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?生产模式必须设置 ADMIN_PASSWORD}
      - YIBAO_ADMIN_SECRET=${YIBAO_ADMIN_SECRET:?生产模式必须设置 YIBAO_ADMIN_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:?生产模式必须设置 CORS_ORIGINS 白名单（逗号分隔）}
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - DEMO_OFFLINE=${DEMO_OFFLINE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [meditrust-edge, meditrust-internal]
    profiles: ["prod"]

  # ============================================================
  # 前端
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yibao-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [meditrust-edge]
    profiles: ["dev"]

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yibao-frontend-prod
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [meditrust-edge]
    profiles: ["prod"]

  # ============================================================
  # PostgreSQL（生产数据库；仅 meditrust-internal 可达，不映射宿主机端口）
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: yibao-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yibao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yibao123}
      POSTGRES_DB: ${POSTGRES_DB:-yibao}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yibao} -d ${POSTGRES_DB:-yibao}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [meditrust-internal]

  # ============================================================
  # Redis（缓存/会话；仅 meditrust-internal 可达，不映射宿主机端口）
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: yibao-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [meditrust-internal]

  # ============================================================
  # ChromaDB（向量库，可选；仅 meditrust-internal 可达）
  # ============================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: yibao-chromadb
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [meditrust-internal]
    profiles: ["dev", "prod"]

  # ============================================================
  # 监控栈（docker compose --profile monitoring up -d）
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: yibao-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alert-rules.yml:/etc/prometheus/rules/alert-rules.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [meditrust-internal]
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    container_name: yibao-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      # 生产必须设置 GRAFANA_PASSWORD 环境变量（出厂默认口令会被拦截）
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?启动监控栈必须设置 GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/oumed-trust.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [meditrust-internal]
    profiles: ["monitoring"]

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  prometheus_data:
  grafana_data:

networks:
  # 边缘网络：对外服务（前端、需要被前端/浏览器访问的后端）
  meditrust-edge:
    driver: bridge
  # 内部网络：后端 ↔ 数据层（postgres/redis/chromadb/监控），不暴露宿主机端口
  meditrust-internal:
    driver: bridge
    internal: true
