# nginx 反向代理配置（生产环境用）
# 用法：nginx -c /path/to/nginx.conf
# 前提：前端构建产物在 /var/www/meditrust，后端 uvicorn 跑在 8000 端口
#
# 注意：本文件为完整 nginx 主配置（含 events/http 块），nginx -c 直接加载。
# limit_req_zone 等指令只能写在 http 上下文，写在 server 块内会导致启动失败。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream yibao_backend {
        server 127.0.0.1:8000;
        # 水平扩展时增加后端节点：
        # server 127.0.0.1:8001;
        # server 127.0.0.1:8002;
        keepalive 32;
    }

    # 限流（http 上下文）：防恶意调用，10r/s + 20 突发
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name meditrust.example.com;  # 生产替换为真实域名

        # HTTP → HTTPS 重定向（生产必开）
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name meditrust.example.com;  # 生产替换为真实域名

        # SSL 证书（生产替换为真实路径）
        ssl_certificate     /etc/nginx/ssl/yibao.pem;
        ssl_certificate_key /etc/nginx/ssl/yibao.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS：强制后续访问走 HTTPS（2 年）
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # 上传文件大小限制（OCR 发票图片）
        client_max_body_size 12M;

        # 前端静态资源（Next.js 构建产物）
        root /var/www/meditrust;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源长缓存
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API 反向代理到后端
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://yibao_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # LLM 调用可能较慢，超时设长
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # OCR 上传走特殊超时
            location ~ ^/api/claims/ocr$ {
                proxy_pass http://yibao_backend;
                client_max_body_size 12M;
                proxy_read_timeout 120s;
            }
        }

        # 健康检查（不记日志）
        location /api/health {
            proxy_pass http://yibao_backend;
            access_log off;
        }

        # Prometheus 采集端点（仅计数指标，不含个人数据）：仅允许内网采集，
        # 杜绝公网通过 /metrics 探测业务量
        location /metrics {
            proxy_pass http://yibao_backend;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
