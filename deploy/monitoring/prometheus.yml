# 医数可信 Prometheus 配置（docker compose --profile monitoring 启用）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alert-rules.yml

scrape_configs:
  - job_name: oumed-trust-backend
    metrics_path: /metrics
    static_configs:
      # dev profile 用 backend，prod profile 用 backend-prod（同一 job 内双目标；
      # 未启用的那台在 Prometheus 中显示为 down，不影响另一台采集）
      - targets: ["backend:8000"]
        labels:
          env: dev
      - targets: ["backend-prod:8000"]
        labels:
          env: prod
